[tools]
java = "openjdk-27.0.0"

[tasks.build]
description = "Скомпилировать лабораторную 2"
run = """
rm -rf build/classes
mkdir -p build/classes
javac -encoding UTF-8 -Xlint:all -d build/classes src/lab2/Main.java
"""

[tasks.lab2]
description = "Построить индекс примера или указанной папки"
alias = "default"
depends = ["build"]
raw = true
run = "java -cp build/classes lab2.Main"

[tasks.spring]
description = "Скачать Spring Framework и построить индекс его исходников"
depends = ["build"]
raw = true
run = """
if [ ! -d build/spring-framework ]; then
    git clone --depth 1 --branch v7.0.9 https://github.com/spring-projects/spring-framework.git build/spring-framework
fi
java -cp build/classes lab2.Main build/spring-framework
"""

[tasks.test]
description = "Проверить лабораторную 2"
depends = ["build"]
run = "./test.sh"

[tasks."build:lab3"]
description = "Скомпилировать только лабораторную 3"
run = """
rm -rf build/lab3
mkdir -p build/lab3
javac -encoding UTF-8 -Xlint:all -d build/lab3 src/lab3/Main.java
"""

[tasks.lab3]
description = "Лабораторная 3: отдельный поток и индекс на каждый файл"
depends = ["build:lab3"]
raw = true
run = "java -cp build/lab3 lab3.Main"

[tasks."test:lab3"]
description = "Проверить лабораторную 3"
depends = ["build:lab3"]
run = "./test.sh 3"

[tasks."build:lab4"]
