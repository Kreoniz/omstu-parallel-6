[tools]
java = "openjdk-27.0.0"

[tasks.build]
description = "Скомпилировать все лабораторные независимо"
depends = ["build:lab2", "build:lab3", "build:lab4", "build:lab5", "build:lab6"]

[tasks.test]
description = "Проверить лабораторные 2–6"
depends = ["build"]
run = ["./test.sh 2", "./test.sh 3", "./test.sh 4", "./test.sh 5", "./test.sh 6"]

[tasks.spring]
description = "Запустить выбранную лабораторную на Spring: spring [2–6] [потоки]"
raw = true
run = '''
#!/bin/sh
set -eu
lab=${1:-2}
case "$lab" in
    2|3|4|5|6) ;;
    *) echo 'Номер лабораторной должен быть от 2 до 6' >&2; exit 1 ;;
esac
if [ "$#" -gt 0 ]; then shift; fi
mkdir -p build
if [ ! -d build/spring-framework ]; then
    git clone --depth 1 --branch v7.0.9 https://github.com/spring-projects/spring-framework.git build/spring-framework
fi
exec mise run "lab$lab" build/spring-framework "$@"
'''

[tasks."build:lab2"]
description = "Скомпилировать только лабораторную 2"
run = """
rm -rf build/lab2
mkdir -p build/lab2
javac -encoding UTF-8 -Xlint:all -d build/lab2 src/lab2/Main.java
"""

[tasks.lab2]
description = "Последовательный обратный индекс Spring или указанной папки"
alias = "default"
depends = ["build:lab2"]
raw = true
run = '''
#!/bin/sh
set -eu
if [ "$#" -eq 0 ] && [ ! -d build/spring-framework ]; then
    git clone --depth 1 --branch v7.0.9 https://github.com/spring-projects/spring-framework.git build/spring-framework
fi
exec java -cp build/lab2 lab2.Main "$@"
'''

[tasks."test:lab2"]
description = "Проверить лабораторную 2"
depends = ["build:lab2"]
run = "./test.sh 2"

[tasks."build:lab3"]
